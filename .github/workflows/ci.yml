name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Offline fixture pipeline
        run: uv run forecastgate reproduce --fixture

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t forecastgate .
      - name: Offline fixture pipeline in the image
        run: docker run --rm --network none forecastgate uv run forecastgate reproduce --fixture
