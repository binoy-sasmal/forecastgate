[project]
name = "forecastgate"
version = "0.1.0"
description = "Weekly sales forecasting pipeline with leakage-safe backtesting, a promotion gate and versioned batch predictions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandera>=0.24",
    "pyarrow>=18",
    "typer>=0.15",
]

[project.scripts]
forecastgate = "forecastgate.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
